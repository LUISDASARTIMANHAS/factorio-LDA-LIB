[item-description]
throw-in-water=Um item especial que pode ser lançado na água para criar efeitos únicos.
yumako-seed-x2=duplicação de sementes
biomass=A biomassa é um combustível produzido a partir de diversas formas de matéria orgânica, como folhas e madeira. É utilizada para alimentar queimadores de biomassa e veículos, fornecendo significativamente mais energia do que as folhas, mas menos do que o biocombustível sólido. Também é utilizada na construção civil.
solid-biofuel=O biocombustível sólido é um combustível produzido a partir de biomassa. É utilizado para alimentar queimadores de biomassa e veículos, sendo a forma mais eficiente de energia proveniente de biomassa sólida, perdendo apenas para o biocombustível líquido.
liquid-biofuel=O biocombustível líquido é um fluido refinado a partir do biocombustível sólido. Pode ser usado para alimentar geradores de combustível.

