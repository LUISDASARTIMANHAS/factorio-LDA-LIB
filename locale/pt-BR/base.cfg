[item-description]
throw-in-water=Um item especial que pode ser lançado na água para criar efeitos únicos.
yumako-seed-x2=duplicação de sementes
biomass=A biomassa é um combustível produzido a partir de diversas formas de matéria orgânica, como folhas e madeira. É utilizada para alimentar queimadores de biomassa e veículos, fornecendo significativamente mais energia do que as folhas, mas menos do que o biocombustível sólido. Também é utilizada na construção civil.
solid-biofuel=O biocombustível sólido é um combustível produzido a partir de biomassa. É utilizado para alimentar queimadores de biomassa e veículos, sendo a forma mais eficiente de energia proveniente de biomassa sólida, perdendo apenas para o biocombustível líquido.
liquid-biofuel=O biocombustível líquido é um fluido refinado a partir do biocombustível sólido. Pode ser usado para alimentar geradores de combustível.
bauxite-ore=Rocha sedimentar rica em óxidos e hidróxidos de alumínio. Principal matéria-prima para a produção de alumínio.
spodumene-ore=O minério de lítio mais explorado comercialmente, sendo a principal fonte no Brasil (Vale do Jequitinhonha, MG).
lepidolite-ore=Mica de cor rosada/lilás rica em lítio.
petalite-ore=Mineral original a partir do qual o elemento lítio foi descoberto pela primeira vez.
amblygonite-ore=Aluminossilicato e fosfato rico em lítio e flúor.
montebrasite-ore=Mineral isomorfo da ambligonita com elevado teor de lítio.
sphalerite-ore=Sulfeto de zinco (ZnS). O principal e mais importante minério de zinco no mundo.
smithsonite-ore=Carbonato de zinco (ZnCO₃). Importante fonte secundária de zinco.
hemimorphite-ore=Silicato hidratado de zinco (Zn₄Si₂O₇(OH)₂·H₂O), historicamente conhecido como calamina.
willemite-ore=Silicato de zinco (Zn₂SiO₄), fluorescente sob luz ultravioleta.
wurtzite-ore=Forma polimorfa de alta temperatura do sulfeto de zinco ((Zn,Fe)S).
zincite-ore=Óxido de zinco natural (ZnO), de coloração vermelho-alaranjada característica.
franklinite-ore=Mineral óxido de ferro, zinco e manganês (ZnFe₂O₄).
marmatite-ore=Variedade de esfalerita com elevado teor de ferro ((Zn,Fe)S).

