[item-description]
bauxite-ore=Rocha sedimentar rica em óxidos e hidróxidos de alumínio. Principal matéria-prima para a produção de alumínio.
spodumene-ore=O minério de lítio mais explorado comercialmente, sendo uma importante fonte de lítio no Brasil.
lepidolite-ore=Mica de cor rosada ou lilás rica em lítio.
petalite-ore=Mineral a partir do qual o elemento lítio foi descoberto pela primeira vez.
amblygonite-ore=Aluminossilicato e fosfato rico em lítio e flúor.
montebrasite-ore=Mineral isomorfo da ambligonita com elevado teor de lítio.
sphalerite-ore=Sulfeto de zinco (ZnS). O principal e mais importante minério de zinco no mundo.
smithsonite-ore=Carbonato de zinco (ZnCO₃). Importante fonte secundária de zinco.
hemimorphite-ore=Silicato hidratado de zinco (Zn₄Si₂O₇(OH)₂·H₂O), historicamente conhecido como calamina.
willemite-ore=Silicato de zinco (Zn₂SiO₄), fluorescente sob luz ultravioleta.
wurtzite-ore=Forma polimorfa do sulfeto de zinco ((Zn,Fe)S).
zincite-ore=Óxido de zinco natural (ZnO), de coloração vermelho-alaranjada característica.
franklinite-ore=Mineral óxido de ferro, zinco e manganês (ZnFe₂O₄).
marmatite-ore=Variedade de esfalerita com elevado teor de ferro ((Zn,Fe)S).
native-gold-ore=Ouro encontrado naturalmente em estado metálico, geralmente contendo pequenas quantidades de prata ou cobre.
electrum=Liga natural de ouro e prata (Au,Ag), com pelo menos 20% de prata em sua composição.
calaverite=Telureto de ouro (AuTe₂), mineral de coloração amarelo-latão ou branco-prateada.
sylvanite=Telureto de ouro e prata ((Au,Ag)Te₂), conhecido por seus cristais com padrões semelhantes a letras e símbolos.
petzite=Telureto rico em prata e ouro (Ag₃AuTe₂), de brilho metálico escuro e coloração cinza-aço a preta.
krennerite=Telureto de ouro e prata (Au₁₋ₓAgₓTe₂), com estrutura cristalina diferente da calaverita.
maldonite=Liga natural rara de ouro e bismuto (Au₂Bi), que pode apresentar coloração prateada, acobreada ou escura.
aurostibite=Antimoneto de ouro (AuSb₂), mineral raro de coloração cinza-chumbo.

