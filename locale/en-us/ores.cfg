[item-description]
bauxite-ore=Sedimentary rock rich in aluminum oxides and hydroxides. The primary raw material for aluminum production.
spodumene-ore=The most commercially exploited lithium ore, representing an important source of lithium in Brazil.
lepidolite-ore=Rose-colored or lilac mica mineral rich in lithium.
petalite-ore=Mineral from which the element lithium was first discovered.
amblygonite-ore=Lithium-rich aluminum phosphate and silicate mineral containing fluorine.
montebrasite-ore=Isomorph of amblygonite with a high lithium content.
sphalerite-ore=Zinc sulfide (ZnS). The principal and most important zinc ore in the world.
smithsonite-ore=Zinc carbonate (ZnCO₃). An important secondary source of zinc.
hemimorphite-ore=Zinc silicate hydrate (Zn₄Si₂O₇(OH)₂·H₂O), historically known as calamine.
willemite-ore=Zinc silicate (Zn₂SiO₄), fluorescent under ultraviolet light.
wurtzite-ore=Polymorphic form of zinc sulfide ((Zn,Fe)S).
zincite-ore=Natural zinc oxide (ZnO), characterized by its reddish-orange color.
franklinite-ore=Iron, zinc, and manganese oxide mineral (ZnFe₂O₄).
marmatite-ore=Variety of sphalerite with a high iron content ((Zn,Fe)S).
native-gold-ore=Gold naturally occurring in metallic form, usually containing small amounts of silver or copper.
electrum=Natural gold-silver alloy (Au,Ag), containing at least 20% silver by mass.
calaverite=Gold telluride (AuTe₂), a mineral with a brass-yellow to silvery-white color.
sylvanite=Gold and silver telluride ((Au,Ag)Te₂), known for its crystals with patterns resembling letters and symbols.
petzite=Silver-rich gold telluride (Ag₃AuTe₂), with a dark metallic luster and a steel-gray to black color.
krennerite=Gold-silver telluride (Au₁₋ₓAgₓTe₂), with a crystal structure different from calaverite.
maldonite=Rare natural gold-bismuth alloy (Au₂Bi), which may exhibit silvery, coppery, or dark coloration.
aurostibite=Gold antimonide (AuSb₂), a rare mineral with a lead-gray color.

