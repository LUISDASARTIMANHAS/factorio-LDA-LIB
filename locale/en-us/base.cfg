bauxite-ore=Sedimentary rock rich in aluminum hydroxides and iron oxides. The world's primary source of aluminum.
spodumene-ore=The primary commercial source of lithium mineral, widely mined worldwide.
lepidolite-ore=Lithium-bearing lilac-gray or rose-colored mica mineral.
petalite-ore=Lithium aluminium phyllosilicate mineral where lithium was historically discovered.
amblygonite-ore=Fluorophosphate mineral rich in lithium and aluminum.
montebrasite-ore=Isomorph of amblygonite rich in lithium content.
sphalerite-ore=Zinc sulfide (ZnS). The principal and most important zinc ore in the world.
smithsonite-ore=Zinc carbonate (ZnCO₃). A prominent secondary zinc ore mineral.
hemimorphite-ore=Zinc silicate hydroxide hydrate (Zn₄Si₂O₇(OH)₂·H₂O), historically known as calamine.
willemite-ore=Zinc orthosilicate (Zn₂SiO₄), famous for fluorescence under UV light.
wurtzite-ore=High-temperature polymorph of zinc sulfide ((Zn,Fe)S).
zincite-ore=Natural zinc oxide (ZnO), characterized by bright red-orange color.
franklinite-ore=Zinc iron manganese oxide mineral (ZnFe₂O₄).
marmatite-ore=Iron-rich variety of sphalerite ((Zn,Fe)S).

