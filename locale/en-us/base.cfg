[recipe-description]
throw-in-water=A special item that can be thrown into water to create unique effects.
yumako-seed-x2=seed duplication
biomass=Biomass is a fuel item produced from various forms of biomass items such as  Leaves,  Wood. It is used to fuel the Biomass Burner and vehicles, providing significantly more energy than Leaves but less than  Solid Biofuel. It is also the building.
solid-biofuel=Solid Biofuel is a fuel item produced from Biomass. It is used to fuel the Biomass Burner, vehicles, and is the most energy-efficient form of solid biomass power, only beaten by Liquid Biofuel.
liquid-biofuel=Liquid Biofuel is a fluid refined from Solid Biofuel. It can be used to power Fuel Generators.

